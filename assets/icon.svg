<?xml version="1.0" encoding="UTF-8"?>
<!-- ConnectWallet desktop icon. build-icon.mjs embeds the local PNG master. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="navy" x1="24" y1="16" x2="480" y2="496" gradientUnits="userSpaceOnUse">
      <stop stop-color="#24224e"/>
      <stop offset="0.55" stop-color="#14152f"/>
      <stop offset="1" stop-color="#0d1024"/>
    </linearGradient>
    <linearGradient id="rim" x1="64" y1="0" x2="430" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#b8bbff" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#5662b4" stop-opacity="0.04"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="496" height="496" rx="122" fill="url(#navy)"/>
  <rect x="10" y="10" width="492" height="492" rx="120" stroke="url(#rim)" stroke-width="4"/>
  <image href="connectwallet-mark.png" x="16" y="16" width="480" height="480"/>
</svg>

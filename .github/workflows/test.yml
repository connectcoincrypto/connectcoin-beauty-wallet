name: Wallet tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run setup:claims
      - name: Install Linux Electron test dependencies
        if: runner.os == 'Linux'
        run: npx playwright install-deps chromium
      - name: Test Electron UI with an isolated profile
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: xvfb-run --auto-servernum npm run test:ui
      - name: Test Electron responsiveness under claim progress bursts
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: xvfb-run --auto-servernum npm run test:ui:load
      - name: Test locked wallet recovery and replacement
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: xvfb-run --auto-servernum npm run test:ui:recovery
